  <body>
    <div id="root"></div>
    <script>
      (function() {
        var retryTimer = null;
        var retryCount = 0;
        function tryPlayAll() {
          var played = false;
          document.querySelectorAll('video').forEach(function(v) {
            if (v.paused && v.readyState >= 2) { v.play().catch(function(){}); played = true; }
          });
          document.querySelectorAll('audio').forEach(function(a) {
            if (a.paused) { a.play().catch(function(){}); }
          });
          return played;
        }
        document.addEventListener('click', function() {
          tryPlayAll();
          if (retryTimer) clearInterval(retryTimer);
          retryCount = 0;
          retryTimer = setInterval(function() {
            retryCount++;
            if (tryPlayAll() || retryCount >= 25) { clearInterval(retryTimer); retryTimer = null; }
          }, 200);
        }, { capture: true });
      })();
    </script>
  </body>
